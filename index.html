<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Primary Meta -->
<title>Happy Birthday!</title>
<meta name="title" content="Happy Birthday!">
<meta name="description" content="A beautiful birthday surprise page with animations, love, and joy.">
<meta name="keywords" content="birthday, happy birthday, surprise, celebration, gift">
<meta name="author" content="Your Name">
<meta name="robots" content="index, follow">

<!-- Theme Color -->
<meta name="theme-color" content="#ff69b4">

<!-- Favicon -->
<link rel="icon" type="image/jpeg" href="https://files.catbox.moe/ry9kyx.jpeg">
<link rel="apple-touch-icon" href="https://files.catbox.moe/ry9kyx.jpeg">

<!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://yourwebsite.com/">
<meta property="og:title" content="Happy Birthday! 🎉">
<meta property="og:description" content="A special birthday surprise page made with love 💖">
<meta property="og:image" content="https://files.catbox.moe/ry9kyx.jpeg">

<!-- Twitter Card (X icon preview 😏) -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:url" content="https://yourwebsite.com/">
<meta name="twitter:title" content="Happy Birthday! 🎉">
<meta name="twitter:description" content="A special birthday surprise page made with love 💖">
<meta name="twitter:image" content="https://files.catbox.moe/ry9kyx.jpeg">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

<!-- CSS -->
<link rel="stylesheet" href="index.css">
</head>
<body>

<!-- PARTICLES -->
<div class="particles" id="particles"></div>




<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="this.classList.remove('active')">
  <img id="lightbox-img" src="" alt="Photo">
</div>

<main>
  <!-- 1: SPECIAL MESSAGE -->
  <div class="page-section" data-section="Message" id="sec-message">
    <h2 class="section-title"><span class="title-icon"><i data-lucide="lock"></i></span> Unlock the Surprise</h2>
    <div class="message-card">
      <input type="text" id="password" placeholder="Enter password">
      <p id="message"></p>
    </div>
    <div class="section-nav">
      <button class="nav-btn" onclick="validatePassword()"> Submit</button>
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    <p>Made with <span class="heart"><i data-lucide="heart"></i></span> just for you</p>
    <p style="margin-top:.5rem;font-size:.75rem;color:rgba(255,255,255,0.3)">
      <span class="footer-cake"><i data-lucide="cake"></i> Happy Birthday TEENA!</span>
    </p>
  </footer>
</main>

<!-- LUCIDE ICONS CDN -->
<script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>

<script src="index.js"></script>
</body>
</html>
